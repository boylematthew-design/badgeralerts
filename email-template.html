<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BadgerAlerts Notification</title>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap");

      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: "Plus Jakarta Sans", Helvetica, Arial, sans-serif;
      }
      table {
        border-collapse: collapse;
      }
      .main-content {
        background-color: #ffffff;
        border-radius: 24px;
        overflow: hidden;
      }
      .btn {
        background-color: #10b981;
        color: #ffffff !important;
        padding: 16px 32px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 800;
        display: inline-block;
      }

      @media screen and (max-width: 600px) {
        .main-content {
          width: 100% !important;
          border-radius: 0 !important;
        }
        .mobile-padding {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8fafc">
    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
    >
      <tr>
        <td align="center" style="padding: 40px 10px">
          <table
            class="main-content"
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="
              border: 1px solid #e2e8f0;
              box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            "
          >
            <tr>
              <td
                class="mobile-padding"
                style="padding: 32px 40px; border-bottom: 1px solid #f1f5f9"
              >
                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td
                      style="
                        font-size: 20px;
                        font-weight: 800;
                        color: #0f172a;
                        letter-spacing: -0.5px;
                      "
                    >
                      BADGER<span style="color: #10b981">ALERTS</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="mobile-padding" style="padding: 40px 40px 20px 40px">
                <h1
                  style="
                    margin: 0;
                    font-size: 32px;
                    font-weight: 800;
                    color: #0f172a;
                    line-height: 1.2;
                    letter-spacing: -1px;
                  "
                >
                  You have a new alert.
                </h1>
                <p
                  style="
                    font-size: 16px;
                    line-height: 26px;
                    color: #64748b;
                    margin-top: 16px;
                  "
                >
                  We have scanned your site and have the following alert:
                </p>
              </td>
            </tr>

            <tr>
              <td class="mobile-padding" style="padding: 20px 40px 40px 40px">
                <table
                  width="100%"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    margin-bottom: 30px;
                    border: 1px solid #e2e8f0;
                    border-radius: 16px;
                  "
                >
                  <tr>
                    <td style="padding: 20px">
                      <table
                        width="100%"
                        border="0"
                        cellspacing="0"
                        cellpadding="0"
                      >
                        <tr>
                          <td
                            width="40"
                            style="
                              background-color: #f59e0b;
                              border-radius: 8px;
                              text-align: center;
                              color: #ffffff;
                              height: 40px;
                            "
                          >
                            !
                          </td>
                          <td style="padding-left: 15px">
                            <div
                              style="
                                font-size: 11px;
                                font-weight: 800;
                                color: #d97706;
                                text-transform: uppercase;
                              "
                            >
                              Performance
                            </div>
                            <div
                              style="
                                font-size: 15px;
                                font-weight: 700;
                                color: #0f172a;
                              "
                            >
                              LCP Delay Detected
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>

                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center">
                      <a href="#" class="btn">View alert</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                align="center"
                style="
                  background-color: #f8fafc;
                  padding: 30px;
                  border-top: 1px solid #e2e8f0;
                "
              >
                <p style="font-size: 12px; color: #94a3b8; margin: 0">
                  &copy; 2026 BadgerAlerts Intelligence Systems.<br />
                  <a href="#" style="color: #64748b">Unsubscribe</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
