<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BadgerBuild Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #eff4fb;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 320px 1fr;
      }

      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        color: #94a3b8;
        font-size: 18px;
        font-weight: 500;
        transition: 0.2s ease;
        cursor: pointer;
      }

      .sidebar-link:hover {
        background: rgba(255, 255, 255, 0.06);
        color: white;
      }

      .sidebar-link.active {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .sidebar-link.active svg {
        color: #22c55e;
      }

      .notification-row {
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        border: 1px solid #dbe4f0;
        background: white;
        border-radius: 22px;
        padding: 22px 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
        transition: 0.2s ease;
        text-align: left;
      }

      .notification-row:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.07);
        border-color: #cfdbea;
      }

      .notification-row.hidden {
        display: none;
      }

      .top-tab {
        border: 1px solid #d8e2ef;
        background: white;
        color: #475569;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .top-tab:hover {
        border-color: #c2d1e3;
        color: #0f172a;
      }

      .top-tab.active {
        background: #0f172a;
        color: white;
        border-color: #0f172a;
      }

      @media (max-width: 960px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      const sidebarLinks = document.querySelectorAll(
        ".sidebar-link[data-filter]",
      );
      const topTabs = document.querySelectorAll(".top-tab");
      const rows = document.querySelectorAll(".notification-row");
      const emptyState = document.getElementById("emptyState");
      const pageTitle = document.getElementById("pageTitle");
      const pageSubtitle = document.getElementById("pageSubtitle");
      const statAll = document.getElementById("statAll");
      const statUrgent = document.getElementById("statUrgent");
      const statOpportunity = document.getElementById("statOpportunity");

      let activeSidebar = "all";
      let activeTop = "all";

      const titles = {
        all: {
          title: "Notifications",
          subtitle: "All alerts and opportunities across your account.",
        },
        seo: {
          title: "SEO alerts",
          subtitle: "Ranking, performance and search visibility issues.",
        },
        social: {
          title: "Social alerts",
          subtitle: "Social traction, mentions and content momentum.",
        },
        competitors: {
          title: "Competitor alerts",
          subtitle: "Moves from competitors worth reacting to.",
        },
        content: {
          title: "Content alerts",
          subtitle: "Content opportunities, structure issues and gaps.",
        },
        ads: {
          title: "Paid media alerts",
          subtitle: "Campaign efficiency and spend opportunities.",
        },
      };

      function rowMatchesSidebar(row) {
        if (activeSidebar === "all") return true;
        return row.dataset.category.split(" ").includes(activeSidebar);
      }

      function rowMatchesTop(row) {
        if (activeTop === "all") return true;
        return row.dataset.type === activeTop;
      }

      function updateStats(visibleRows) {
        statAll.textContent = visibleRows.length;
        statUrgent.textContent = visibleRows.filter(
          (row) => row.dataset.type === "urgent",
        ).length;
        statOpportunity.textContent = visibleRows.filter(
          (row) => row.dataset.type === "opportunity",
        ).length;
      }

      function applyFilters() {
        const visibleRows = [];

        rows.forEach((row) => {
          const visible = rowMatchesSidebar(row) && rowMatchesTop(row);
          row.classList.toggle("hidden", !visible);
          if (visible) visibleRows.push(row);
        });

        emptyState.classList.toggle("hidden", visibleRows.length !== 0);
        updateStats(visibleRows);
        pageTitle.textContent = titles[activeSidebar].title;
        pageSubtitle.textContent = titles[activeSidebar].subtitle;
      }

      sidebarLinks.forEach((link) => {
        link.addEventListener("click", () => {
          sidebarLinks.forEach((item) => item.classList.remove("active"));
          link.classList.add("active");
          activeSidebar = link.dataset.filter;
          applyFilters();
        });
      });

      topTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          topTabs.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");
          activeTop = tab.dataset.filter;
          applyFilters();
        });
      });

      applyFilters();
    </script>
  </body>
</html>
